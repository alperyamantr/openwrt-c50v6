name: Build OpenWrt Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  OPENWRT_VERSION: v25.12.5

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget curl

      - name: Clone OpenWrt source
        run: |
          git clone --depth 1 --branch ${{ env.OPENWRT_VERSION }} https://github.com/openwrt/openwrt.git

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run prepare.sh (Kernel patches)
        run: |
          chmod +x scripts/prepare.sh
          ./scripts/prepare.sh

      - name: Copy custom config
        run: |
          cd openwrt
          cp ../.config .config 2>/dev/null || true
          make defconfig

      - name: Download package sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            openwrt/bin/targets/ramips/mt76x8/*-sysupgrade.bin
            openwrt/bin/targets/ramips/mt76x8/*-factory.bin