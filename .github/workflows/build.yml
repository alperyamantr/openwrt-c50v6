name: Build OpenWrt for C50 v6

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OPENWRT_VERSION: v25.12.5

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 https://github.com/openwrt/openwrt.git
          cd openwrt
          git fetch --depth=1 origin tag ${{ env.OPENWRT_VERSION }}
          git checkout ${{ env.OPENWRT_VERSION }}

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare build
        run: |
          chmod +x scripts/*.sh
          cd openwrt && ../scripts/prepare.sh

      - name: Copy custom files
        working-directory: openwrt
        run: |
          mkdir -p files
          cp -a ../files/. files/

      - name: Optimize
        working-directory: openwrt
        run: ../scripts/optimize.sh

      - name: Normalize config
        working-directory: openwrt
        run: make defconfig

        - name: Verify config
        working-directory: openwrt
        run: |
          grep -q "CONFIG_PACKAGE_fstools=y" .config || (echo "ERROR: fstools missing!" && exit 1)
          grep -q "CONFIG_PACKAGE_block-mount=y" .config || (echo "ERROR: block-mount missing!" && exit 1)

      - name: Download sources
        working-directory: openwrt
        run: make download -j$(nproc)

      - name: Build firmware
        working-directory: openwrt
        run: make -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: openwrt/bin/targets/