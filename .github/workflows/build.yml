name: Build OpenWrt Firmware
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
env:
  OPENWRT_VERSION: v25.12.5
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache OpenWrt feeds & dl
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/feeds
          key: openwrt-${{ env.OPENWRT_VERSION }}-${{ hashFiles('profiles/packages.txt') }}
          restore-keys: |
            openwrt-${{ env.OPENWRT_VERSION }}-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext \
            git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget curl ccache

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 --branch ${OPENWRT_VERSION} https://github.com/openwrt/openwrt.git

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch kernel config
        run: |
          chmod +x scripts/patch-kernel.sh
          scripts/patch-kernel.sh

      - name: Prepare build
        working-directory: openwrt
        run: |
          chmod +x ../scripts/*.sh
          ../scripts/prepare.sh
          echo "==> LuCI packages"
          grep "CONFIG_PACKAGE_luci" .config || true
          echo "==> Disabled packages"
          grep "CONFIG_PACKAGE_ppp\|CONFIG_PACKAGE_odhcp" .config || true
          echo "==> Target device check"
          grep "CONFIG_TARGET.*DEVICE" .config || (echo "ERROR: No target device!" && exit 1)

      - name: Copy custom files
        run: |
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/

      - name: Optimize build
        working-directory: openwrt
        run: |
          ../scripts/optimize.sh
          make defconfig

      - name: Show target
        working-directory: openwrt
        run: |
          echo "=== Target config ==="
          grep '^CONFIG_TARGET' .config
          echo "=== Device check ==="
          grep "CONFIG_TARGET.*DEVICE" .config || (echo "WARNING: No target device!" && exit 1)

      - name: Verify critical packages
        working-directory: openwrt
        run: |
          grep -q "^CONFIG_PACKAGE_fstools=y$" .config || (echo "ERROR: fstools missing!" && exit 1)
          grep -q "^CONFIG_PACKAGE_block-mount=y$" .config || (echo "ERROR: block-mount missing!" && exit 1)
          grep -q "^CONFIG_PACKAGE_kmod-zram=y$" .config || (echo "ERROR: kmod-zram missing!" && exit 1)
          grep -q "^CONFIG_PACKAGE_zram-swap=y$" .config || (echo "ERROR: zram-swap missing!" && exit 1)
          echo "OK: all critical packages present"

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s
          echo "=== Post-build target dir ==="
          ls -la bin/targets/ramips/mt76x8/ 2>/dev/null || true

      - name: Verify images exist
        working-directory: openwrt
        run: |
          echo "=== Checking for .bin files ==="
          if [ ! "$(ls -A bin/targets/ramips/mt76x8/*.bin 2>/dev/null)" ]; then
            echo "ERROR: No .bin firmware files generated!"
            echo "=== Target dir contents ==="
            ls -la bin/targets/ramips/mt76x8/ 2>/dev/null || true
            exit 1
          fi
          echo "OK: Firmware images found"

      - name: Check image size
        working-directory: openwrt
        run: |
          echo "=== Image sizes ==="
          find bin/targets/ramips/mt76x8 -maxdepth 1 -name "*.bin" -type f -exec ls -lh {} \; 2>/dev/null || true
          for f in bin/targets/ramips/mt76x8/*.bin; do
            [ -e "$f" ] || continue
            size=$(stat -c%s "$f")
            kb=$(($size/1024))
            echo "$f: ${kb}KB"
            if [ "$size" -gt 7600000 ]; then
              echo "WARNING: $f is over 7.6MB — close to 8MB flash limit!"
            fi
          done

      - name: Debug kernel config (on failure)
        if: failure()
        run: |
          echo "=== Build FAILED — dumping debug info ==="
          echo "=== Kernel config tail ==="
          tail -30 openwrt/target/linux/ramips/mt76x8/config-6.12
          echo ""
          echo "=== Duplicate check ==="
          sort openwrt/target/linux/ramips/mt76x8/config-6.12 | uniq -d
          echo ""
          echo "=== .config tail ==="
          tail -30 openwrt/.config
          echo ""
          echo "=== Kernel config-6.12 Westwood entries ==="
          grep -n "WESTWOOD\|SWAP\|CONG_ADVANCED\|DEFAULT_TCP_CONG" openwrt/target/linux/ramips/mt76x8/config-6.12 || true
          echo ""
          echo "=== Target dir ==="
          ls -la openwrt/bin/targets/ramips/mt76x8/ 2>/dev/null || true

      - name: Generate checksums
        working-directory: openwrt/bin/targets
        run: |
          find . -type f ! -name sha256sums.txt -exec sha256sum {} \; | sort > sha256sums.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-c50v6-${{ github.run_number }}
          compression-level: 0
          if-no-files-found: error
          path: |
            openwrt/bin/targets/**